version: "3.9"

services:
  app:
    build: .
    depends_on:
      db:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - media_volume:/app/media
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
